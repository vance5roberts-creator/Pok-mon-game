name: Update watchlist data

on:
  schedule:
    # ~4:30pm US/Eastern on weekdays, after the market close (21:30 UTC during EDT, 21:30 UTC is 4:30pm EDT / 5:30pm EST — close enough year-round for daily EOD data).
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run updater
        run: python scripts/update_watchlist.py

      - name: Commit changes if any
        run: |
          git config user.name "catalyst-flow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/watchlist.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update watchlist data"
            git push
          fi
